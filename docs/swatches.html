<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧁 sugar for obsidian ✨ palette swatches 🍭</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;background:#1b1b1b;color:#e8e8e8;padding:18px 16px 60px}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;max-width:1180px;margin:0 auto 18px}
  .bar h1{font-size:16px;letter-spacing:-.01em}
  .bar .sp{margin-left:auto;display:flex;gap:14px;font-size:13px}
  .bar a{color:#FFB8D0;text-decoration:none;border-bottom:1px dotted #FFB8D0aa}
  .bar a:hover{color:#fff}
  .grid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{border:1px solid #333;border-radius:12px;overflow:hidden;background:#161616}
  .card>h2{font-size:13px;font-weight:600;padding:9px 14px;background:#232323;border-bottom:1px solid #333;display:flex;gap:8px;align-items:baseline}
  .card>h2 small{color:#888;font-weight:400}
  .swatches{display:flex;flex-wrap:wrap;gap:5px;padding:11px 14px;border-bottom:1px solid #2a2a2a}
  .sw{width:58px}
  .sw .chip{height:26px;border-radius:5px;border:1px solid #fff2}
  .sw .nm{font-size:8.5px;color:#999;margin-top:3px;text-align:center;line-height:1.15}

  /* sample note, themed by per-card CSS vars */
  .note{padding:16px 18px;background:var(--bg);color:var(--text);font-family:var(--body)}
  .note .h1{font-family:var(--ui);color:var(--h1);font-weight:700;font-size:21px;letter-spacing:-.02em;margin-bottom:6px}
  .note .h2{font-family:var(--ui);color:var(--h2);font-weight:700;font-size:15px;margin:12px 0 5px}
  .note .h3{font-family:var(--ui);color:var(--h3);font-weight:700;font-size:13px;margin:11px 0 5px}
  .note p{line-height:1.55;margin:0 0 9px;font-size:14px}
  .note b{color:var(--peach);font-weight:700}
  .note i{color:var(--h2);font-style:italic}
  .note mark{background:color-mix(in srgb,var(--h1) 28%,transparent);color:var(--text);border-radius:3px;padding:0 2px}
  .note s{color:var(--muted)}
  .note a{color:var(--link);background:rgba(255,184,208,.10);border-radius:3px;padding:0 3px;text-decoration:none}
  .note code{font-family:var(--mono);background:var(--code);color:var(--h3);font-size:12px;padding:.1em .4em;border-radius:4px}
  .note pre{font-family:var(--mono);background:var(--code);border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin:0 0 9px;font-size:12px;line-height:1.6;overflow:auto;color:var(--text)}
  .note pre .cmt{color:var(--muted);font-style:italic}
  .note pre .kw{color:var(--salmon)}
  .note pre .fn{color:var(--h3)}
  .note pre .num{color:var(--peach)}
  .note pre .str{color:var(--h1)}
  .note pre .op{color:var(--h5)}
  .note .tag{font-family:var(--ui);font-size:12px;color:color-mix(in srgb,var(--h2) 65%,var(--muted));background:color-mix(in srgb,var(--h2) 12%,transparent);border:1px solid color-mix(in srgb,var(--h2) 36%,transparent);border-radius:20px;padding:.05em .5em}
  .note ul{list-style:none;margin:0 0 9px;padding:0;font-size:14px}
  .note li{padding:1.5px 0;display:flex;align-items:flex-start;gap:7px}
  .note .cb{flex:0 0 auto;width:15px;height:15px;margin-top:3px;border-radius:4px;border:1.6px solid var(--muted);position:relative}
  .note .cb.on{background:var(--mint);border-color:var(--mint)}
  .note .cb.on::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
  .note .done{color:var(--muted);text-decoration:line-through}
  .note .callout{border-left:3px solid;border-radius:0 7px 7px 0;padding:8px 11px;margin:0 0 9px;font-size:13px}
  .note .callout .ct{font-family:var(--ui);font-weight:700;font-size:11px;letter-spacing:.05em;margin-bottom:2px}
  .note .tip{border-color:var(--cctip);background:color-mix(in srgb,var(--cctip) 12%,transparent)}
  .note .tip .ct{color:var(--cctip)}
  .note .warn{border-color:var(--ccwarn);background:color-mix(in srgb,var(--ccwarn) 12%,transparent)}
  .note .warn .ct{color:var(--ccwarn)}

  /* callout gallery (theme callout colours are fixed across palettes) */
  .ccstrip{border-bottom:1px solid #2a2a2a}
</style>
</head>
<body>
<div class="bar">
  <h1>🧁 sugar for obsidian ✨ palette swatches 🍭</h1>
  <span class="sp">
    <a href="palette-editor.html">palette editor →</a>
    <a href="index.html">home</a>
  </span>
</div>
<div class="grid" id="grid"></div>

<script>
/* values mirror theme.css exactly (heading colors = resolved per-variant) */
const PAL = [
 {title:'Taro', sub:'dark mode default', cake:'Taro Mochi', season:'#spring', comment:'steam 20 min, until chewy', temp:212,
  intro:'<b>chewy</b> rice balls, <s>crunchy</s> <i>mild</i>, and <mark>steamed</mark>', cc:{note:'192,176,255',info:'176,216,255',tip:'159,237,216',question:'255,233,160',warning:'255,212,176',danger:'255,160,154',example:'208,168,255',quote:'255,184,208'},
  ing:['glutinous rice flour','steamed taro','coconut milk'], step:'mix, knead,  steam.',
  bg:'#1E1E1E',panel:'#262626',border:'#383838',muted:'#9A93A8',code:'#46415F',text:'#ECECF0',mint:'#9FEDD8',accent:'#C0B0FF',
  link:'#D0A8FF',h1:'#FFE9A0',h2:'#FFB8D0',h3:'#9FEDD8',h4:'#B0D8FF',h5:'#C0B0FF',peach:'#FFD4B0',salmon:'#FFA09A'},
 {title:'Cinnamon', sub:'light mode default', cake:'Cinnamon Roll', season:'#autumn', comment:'bake 25 min, until golden', temp:350,
  intro:'<b>warm</b> swirl, <s>cold</s> <i>gooey</i>, and <mark>cinnamony</mark>', cc:{note:'149,103,47',info:'67,121,119',tip:'95,120,23',question:'149,102,11',warning:'185,81,12',danger:'196,68,48',example:'158,97,42',quote:'178,77,121'},
  ing:['enriched dough','cinnamon sugar','butter'], step:'roll, slice,  bake.',
  bg:'#FBF6EE',panel:'#F6EEE1',border:'#D9C4A6',muted:'#9C7C57',code:'#EFE4D3',text:'#3B2A19',mint:'#7A9A1E',accent:'#B07A38',
  link:'#A2632B',h1:'#D79410',h2:'#B5547E',h3:'#7A9A1E',h4:'#4E8D8A',h5:'#B07A38',peach:'#D65D0E',salmon:'#C44430'},
 {title:'Fairyfloss Classic', sub:'(inspired by sailorhg)', cake:'Fairyfloss', season:'#summer', comment:'spin 3 min, until fluffy', temp:300,
  intro:'<b>spun</b> sugar, <s>heavy</s> <i>pink</i>, and <mark>airy</mark>', cc:{note:'192,176,255',info:'176,216,255',tip:'159,237,216',question:'255,233,160',warning:'255,212,176',danger:'255,160,154',example:'208,168,255',quote:'255,184,208'},
  ing:['caster sugar','a pink wisp','a paper cone'], step:'spin into floss.',
  bg:'#5A5475',panel:'#4E4A6A',border:'#6A6390',muted:'#7A73A0',code:'#403C5C',text:'#F0EEFF',mint:'#9FEDD8',accent:'#C0B0FF',
  link:'#C0B0FF',h1:'#FFE9A0',h2:'#FFE9A0',h3:'#FFE9A0',h4:'#FFE9A0',h5:'#FFD4B0',peach:'#FFD4B0',salmon:'#FFA09A'},
 {title:'Sugarplum', sub:'', cake:'Sugarplum', season:'#winter', comment:'simmer 45 min, until set', temp:220,
  intro:'<b>candied</b> plums, <s>savory</s> <i>jammy</i>, and <mark>spiced</mark>', cc:{note:'129,100,187',info:'81,119,150',tip:'24,130,106',question:'151,107,0',warning:'175,93,32',danger:'209,64,45',example:'142,89,193',quote:'196,65,120'},
  ing:['dried plums','sugar','warm spice'], step:'simmer, roll,  dry.',
  bg:'#FDFAFF',panel:'#F3EEFF',border:'#CEC0FF',muted:'#8878B0',code:'#EDE6FF',text:'#1A1438',mint:'#50D3B0',accent:'#C0B0FF',
  link:'#D0A8FF',h1:'#FFC400',h2:'#FFB8D0',h3:'#50D3B0',h4:'#B0D8FF',h5:'#C0B0FF',peach:'#FFD4B0',salmon:'#FFA09A'},
];
const CHIPS=[['bg','bg'],['panel','panel'],['code','code'],['border','border'],['text','text'],['muted','muted'],
 ['link','link'],['h1','head 1'],['h2','head 2'],['h3','head 3'],['peach','bold'],['salmon','keyword'],['accent','UI accent']];
const vars=p=>['bg','panel','border','muted','code','text','link','h1','h2','h3','h4','h5','peach','salmon','mint']
  .map(k=>`--${k}:${p[k]}`).join(';') + `;--ui:'IBM Plex Mono',monospace;--mono:'IBM Plex Mono',monospace;--body:'Spectral',Georgia,serif;--cctip:rgb(${p.cc.tip});--ccwarn:rgb(${p.cc.warning})`;
const chips=p=>CHIPS.map(([k,n])=>`<div class="sw"><div class="chip" style="background:${p[k]}"></div><div class="nm">${n}</div></div>`).join('');
const CC_CHIPS=[['danger','danger'],['example','example'],['info','info'],['note','note'],['question','question'],['quote','quote'],['tip','tip'],['warning','warning']];
const calloutChips=p=>CC_CHIPS.map(([g,n])=>`<div class="sw"><div class="chip" style="background:rgb(${p.cc[g]})"></div><div class="nm">${n}</div></div>`).join('');
const REPO='https://github.com/chooliu/obsidian-sugar-theme';
const note=p=>`<div class="note" style="${vars(p)};border:3px solid ${p.accent};border-radius:9px;margin:11px 12px 12px">
  <div class="h1">🍰 ${p.cake}</div>
  <p>${p.intro} <span class="tag">#sweet</span> <span class="tag">${p.season}</span></p>
  <div class="h2">ingredients</div>
  <ul>
    <li><span class="cb on"></span><span class="done">${p.ing[0]}</span></li>
    <li><span class="cb"></span><span>${p.ing[1]}</span></li>
    <li><span class="cb"></span><span>${p.ing[2]}</span></li>
  </ul>
  <div class="h3">steps</div>
  <p>${p.step} <a href="${REPO}">recipe →</a></p>
  <pre><span class="cmt"># ${p.comment}</span>
<span class="kw">def</span> <span class="fn">bake</span>(cake, temp<span class="op">=</span><span class="num">${p.temp}</span>):
  <span class="kw">return</span> oven.<span class="fn">warm</span>(cake, temp)</pre>
  <div class="callout tip"><div class="ct">✿ tip</div>best enjoyed fresh.</div>
  <div class="callout warn"><div class="ct">⚠ warning</div>watch the sugar!</div>
</div>`;
document.getElementById('grid').innerHTML = PAL.map(p=>
  `<div class="card" style="border:1px solid ${p.accent}55"><h2>${p.title}${p.sub?`<small>${p.sub}</small>`:''}</h2>
     <div class="swatches">${chips(p)}</div>
     <div class="swatches ccstrip">${calloutChips(p)}</div>${note(p)}</div>`).join('');

</script>
</body>
</html>
